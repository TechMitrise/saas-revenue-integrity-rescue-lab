<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">SaaS Revenue Integrity Rescue Lab</title>
  <desc id="desc">Payment succeeded. Access failed. Executable Laravel engineering proof.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#10251f" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e5"/>
      <stop offset="1" stop-color="#e6dcc9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#paper)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1190" cy="-30" r="250" fill="none" stroke="#c54d35" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="1190" cy="-30" r="190" fill="none" stroke="#c54d35" stroke-opacity="0.1" stroke-width="1"/>
  <g transform="translate(70 65)">
    <circle cx="26" cy="26" r="25" fill="none" stroke="#10251f" stroke-width="1.5"/>
    <text x="26" y="32" text-anchor="middle" fill="#10251f" font-family="Georgia, serif" font-size="17">RI</text>
    <text x="66" y="20" fill="#10251f" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">RESCUE LAB</text>
    <text x="66" y="41" fill="#60716a" font-family="Arial, sans-serif" font-size="10" letter-spacing="1">EXECUTABLE ENGINEERING PROOF</text>
  </g>
  <text x="70" y="205" fill="#c54d35" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">LARAVEL REVENUE PATH / INCIDENT 001</text>
  <text x="70" y="295" fill="#10251f" font-family="Georgia, serif" font-size="70">Payment succeeded.</text>
  <text x="70" y="375" fill="#0c8071" font-family="Georgia, serif" font-size="70" font-style="italic">Access failed.</text>
  <text x="70" y="435" fill="#60716a" font-family="Arial, sans-serif" font-size="19">Duplicate-safe ingestion. Observable queue failure. Safe reconciliation.</text>
  <g transform="translate(70 500)">
    <rect width="1140" height="82" rx="3" fill="#10251f"/>
    <text x="28" y="35" fill="#ddaf3f" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">OBSERVED PROOF</text>
    <text x="28" y="59" fill="#f7f1e5" font-family="Georgia, serif" font-size="19">10 deliveries / 1 event / 1 effect</text>
    <line x1="370" y1="17" x2="370" y2="65" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="405" y="35" fill="#ddaf3f" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">RECOVERY PROOF</text>
    <text x="405" y="59" fill="#f7f1e5" font-family="Georgia, serif" font-size="19">repaired: 1 / repeat no_op: 0</text>
    <line x1="800" y1="17" x2="800" y2="65" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="835" y="35" fill="#ddaf3f" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">STACK</text>
    <text x="835" y="59" fill="#f7f1e5" font-family="Georgia, serif" font-size="19">Laravel / MySQL / Valkey</text>
  </g>
</svg>
